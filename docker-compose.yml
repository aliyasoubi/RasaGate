services:
  gate:
    build: .
    ports: ["8000:8000"]
    environment:
      # Inside compose, Rasa is reachable by service name, not localhost.
      RASA_URL: http://rasa:5005
      RASA_MODEL_PATH: /app/models
      DATABASE_URL: sqlite:////app/data-store/rasa_gate.db
    env_file:
      - path: .env
        required: false
    volumes:
      - ./models:/app/models        # shared with Rasa: ephemeral .tar.gz models
      - gate-data:/app/data-store   # persists the SQLite DB across restarts
    depends_on: [rasa]

  rasa:
    # Pin the version — Rasa's HTTP API changes between releases and
    # `latest` will eventually break the gate.
    image: rasa/rasa:3.6.21
    command: run --enable-api --cors "*" -m /app/models
    ports: ["5005:5005"]
    volumes:
      - ./models:/app/models

volumes:
  gate-data:
